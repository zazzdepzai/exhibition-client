name: Build Exhibition Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Download missing dependencies
        shell: bash
        run: |
          set -e
          mkdir -p libs

          # Spotify Web API Java wrapper used by the client.
          curl -L --fail \
            -o "libs/spotify-web-api-java-6.5.0.jar" \
            "https://repo1.maven.org/maven2/se/michaelthelin/spotify-web-api-java/6.5.0/spotify-web-api-java-6.5.0.jar"

          # Spotify wrapper 6.x uses Apache HttpComponents 5.
          curl -L --fail \
            -o "libs/httpcore5-5.1.2.jar" \
            "https://repo1.maven.org/maven2/org/apache/httpcomponents/core5/httpcore5/5.1.2/httpcore5-5.1.2.jar"

          curl -L --fail \
            -o "libs/httpcore5-h2-5.1.2.jar" \
            "https://repo1.maven.org/maven2/org/apache/httpcomponents/core5/httpcore5-h2/5.1.2/httpcore5-h2-5.1.2.jar"

          echo "Libraries:"
          find libs -maxdepth 1 -type f -name "*.jar" | sort

      - name: Find sources
        run: |
          find src -type f -name "*.java" | sort > sources.txt
          test -s sources.txt
          echo "Found $(wc -l < sources.txt) Java source files."

      - name: Compile
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build/classes build/libs

          CP=""
          while IFS= read -r jar; do
            if [ -z "$CP" ]; then
              CP="$jar"
            else
              CP="$CP:$jar"
            fi
          done < <(find libs -type f -name "*.jar" | sort)

          echo "Compiling with $(echo "$CP" | tr ':' '\n' | wc -l) libraries."

          javac \
            -source 8 \
            -target 8 \
            -encoding UTF-8 \
            -cp "$CP" \
            -d build/classes \
            @sources.txt

      - name: Package
        run: |
          jar cf build/libs/exhibition-client.jar -C build/classes .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exhibition-client
          path: build/libs/exhibition-client.jar
          if-no-files-found: error
