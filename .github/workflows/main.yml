name: Build Exhibition Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Check project
        run: |
          echo "Java version:"
          java -version

          echo "Project files:"
          find . -maxdepth 3 -type f | sort | head -300

      - name: Find Java sources
        run: |
          find . \
            -type f \
            -name "*.java" \
            -not -path "./.git/*" \
            -not -path "./build/*" \
            > sources.txt

          echo "Java source files:"
          wc -l sources.txt
          head -20 sources.txt

      - name: Find libraries
        run: |
          find . \
            -type f \
            -name "*.jar" \
            -not -path "./.git/*" \
            > libraries.txt

          echo "Libraries:"
          cat libraries.txt

      - name: Compile
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build/classes
          mkdir -p build/libs

          if [ ! -s sources.txt ]; then
            echo "ERROR: No .java files found."
            exit 1
          fi

          CP=""

          while IFS= read -r jar; do
            if [ -z "$CP" ]; then
              CP="$jar"
            else
              CP="$CP:$jar"
            fi
          done < libraries.txt

          echo "Classpath:"
          echo "$CP"

          if [ -n "$CP" ]; then
            javac \
              -source 8 \
              -target 8 \
              -encoding UTF-8 \
              -cp "$CP" \
              -d build/classes \
              @sources.txt
          else
            javac \
              -source 8 \
              -target 8 \
              -encoding UTF-8 \
              -d build/classes \
              @sources.txt
          fi

      - name: Package JAR
        run: |
          jar cf build/libs/exhibition-client.jar -C build/classes .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exhibition-client
          path: build/libs/exhibition-client.jar
          if-no-files-found: error
